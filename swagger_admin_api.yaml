openapi: 3.0.3
info:
  title: EcomFashion Admin API
  description: |
    API quản trị hệ thống thương mại điện tử thời trang.
    Base URL: `http://localhost/api`
    Tất cả route đều có prefix `/admin`.
  version: 1.0.0
  contact:
    name: EcomFashion Dev Team

servers:
  - url: http://localhost/api
    description: Local Development

tags:
  - name: Categories
    description: Quản lý danh mục sản phẩm
  - name: Products
    description: Quản lý sản phẩm
  - name: Coupons
    description: Quản lý mã giảm giá
  - name: Customers
    description: Quản lý khách hàng
  - name: Staff
    description: Quản lý nhân viên
  - name: Roles
    description: Quản lý vai trò (RBAC)
  - name: Permissions
    description: Quản lý quyền hạn (RBAC)
  - name: Upload
    description: Upload / xóa ảnh lên storage
  - name: Product Variants
    description: Quản lý biến thể sản phẩm

# ============================================================
# PATHS
# ============================================================
paths:
  /admin/product-variants/search:
    get:
      tags: [Product Variants]
      summary: Tìm kiếm biến thể sản phẩm theo SKU hoặc ID
      operationId: productVariants.search
      parameters:
        - name: q
          in: query
          description: Từ khóa tìm kiếm (SKU hoặc ID)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tìm kiếm thành công.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        sku:
                          type: string
                          example: PROD-VAR-1
                        product_id:
                          type: integer
                          example: 10
        '400':
          description: Lỗi Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Vui lòng cung cấp từ khóa tìm kiếm.
                  data:
                    type: array
                    items:
                      type: object


  # ──────────────────────────────────────────────────────────
  # CATEGORIES
  # ──────────────────────────────────────────────────────────
  /admin/categories:
    get:
      tags: [Categories]
      summary: Lấy danh sách danh mục (phân trang)
      operationId: categories.index
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

    post:
      tags: [Categories]
      summary: Tạo danh mục mới
      operationId: categories.store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMessage'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/categories/parents:
    get:
      tags: [Categories]
      summary: Lấy tất cả danh mục cha (không phân trang, dùng cho dropdown)
      operationId: categories.parents
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /admin/categories/{category}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Categories]
      summary: Lấy chi tiết một danh mục
      operationId: categories.show
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessData'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Categories]
      summary: Cập nhật danh mục
      operationId: categories.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMessage'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Categories]
      summary: Xóa danh mục
      operationId: categories.destroy
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          $ref: '#/components/responses/NotFound'

