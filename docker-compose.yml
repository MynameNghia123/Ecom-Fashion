# ═══════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════
volumes:
  mysql_data:
  backend_vendor:
  backend_bootstrap_cache:
  frontend_node_modules:

# ═══════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════
networks:
  ecom-network:
    driver: bridge
