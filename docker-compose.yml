services:
  # ═══════════════════════════════════════════════════════════════════
  # MySQL 8.4
  # ═══════════════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.4
    container_name: ecom-fashion-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecom_fashion
      MYSQL_USER: ecom_user
      MYSQL_PASSWORD: ecom_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-network

  # ═══════════════════════════════════════════════════════════════════
  # phpMyAdmin
  # ═══════════════════════════════════════════════════════════════════
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ecom-fashion-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecom-network

  # ═══════════════════════════════════════════════════════════════════
  # Laravel Backend
  # ═══════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecom-fashion-backend:latest
    container_name: ecom-fashion-backend
    restart: on-failure:3
    user: root
    env_file:
      - ./backend/.env
    environment:
      PHP_INI_SCAN_DIR: "/usr/local/etc/php/conf.d"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./backend/php-upload.ini:/usr/local/etc/php/conf.d/upload.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecom-network

  # ═══════════════════════════════════════════════════════════════════
  # Vue.js Frontend
  # ═══════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecom-fashion-frontend:latest
    container_name: ecom-fashion-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ecom-network

  # ═══════════════════════════════════════════════════════════════════
  # Mailpit – SMTP catcher & Web UI (dùng để test gửi email OTP)
  # Web UI:  http://localhost:8025
  # SMTP:    host=mailpit  port=1025  (trong Laravel .env)
  # ═══════════════════════════════════════════════════════════════════
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecom-fashion-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI xem mail
      - "1025:1025"   # SMTP cho Laravel
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - ecom-network

# ═══════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════
volumes:
  mysql_data:
  backend_vendor:
  backend_bootstrap_cache:
  frontend_node_modules:

# ═══════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════
networks:
  ecom-network:
    driver: bridge
