      tags: [Roles]
      summary: Gán / đồng bộ danh sách quyền cho vai trò
      operationId: roles.syncPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  description: Danh sách ID quyền muốn gán
                  items:
                    type: integer
                  example: [1, 2, 5]
      responses:
        '200':
          description: Cập nhật quyền thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMessage'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Role'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ──────────────────────────────────────────────────────────
  # PERMISSIONS
  # ──────────────────────────────────────────────────────────
  /admin/permissions:
    get:
      tags: [Permissions]
      summary: Lấy danh sách quyền (phân trang)
      operationId: permissions.index
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'

  /admin/permissions/all:
    get:
      tags: [Permissions]
      summary: Lấy tất cả quyền (không phân trang, dùng cho form gán quyền)
      operationId: permissions.getAll
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'

# ============================================================
# COMPONENTS
# ============================================================
components:

  # ──────────────────────────────────────────────────────────
  # PARAMETERS
  # ──────────────────────────────────────────────────────────
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: ID của resource
      schema:
        type: integer
        example: 1

    SearchQuery:
      name: search
      in: query
      description: Từ khóa tìm kiếm
      required: false
      schema:
        type: string
        example: áo thun

    PerPage:
      name: per_page
      in: query
      description: Số bản ghi mỗi trang (mặc định 10)
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100

  # ──────────────────────────────────────────────────────────
  # RESPONSES
  # ──────────────────────────────────────────────────────────
  responses:
    NotFound:
      description: Resource không tồn tại
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: No query results for model.

    ValidationError:
      description: Lỗi validate dữ liệu
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The given data was invalid.
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  name: ["Tên danh mục không được để trống."]

  # ──────────────────────────────────────────────────────────
  # SCHEMAS — Base response wrappers
  # ──────────────────────────────────────────────────────────
  schemas:
    SuccessData:
      type: object
      properties:
        success:
          type: boolean
          example: true

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    PaginatedSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 10
            total:
              type: integer
              example: 100
            last_page:
              type: integer
              example: 10

    # ──────────────────────────────────────────────────────────
    # SCHEMAS — Resources (Response)
    # ──────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Áo
        slug:
          type: string
          example: ao
        description:
          type: string
          nullable: true
          example: Danh mục áo các loại
        parent_id:
          type: integer
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          example: 10
        image_url:
          type: string
          format: uri
          example: http://localhost/storage/images/products/uuid.jpg
        alt_text:
          type: string
          nullable: true
          example: Ảnh sản phẩm chính
        display_order:
          type: integer
          nullable: true
          example: 1
        is_thumbnail:
          type: boolean
          example: true

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          example: 5
        sku:
          type: string
          example: SKU-AO-TRANG-L
        price:
          type: number
          format: float
          example: 250000
        sale_price:
          type: number
          format: float
          nullable: true
          example: 199000
        cost_price:
          type: number
          format: float
          nullable: true
          example: 150000
        stock_quantity:
          type: integer
          example: 50
        is_active:
          type: boolean
          example: true
        thumbnail:
          type: string
          format: uri
          nullable: true
          example: http://localhost/storage/images/variants/uuid.jpg
        attribute_values:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                nullable: true
              attribute_id:
                type: integer
                example: 1
              value:
                type: string
                example: Trắng

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 2
        name:
          type: string
          example: Áo Thun Basic
        slug:
          type: string
          example: ao-thun-basic
        description:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
          example: Local Brand
        thumbnail:
          type: string
          format: uri
          nullable: true
          example: http://localhost/storage/images/products/uuid.jpg
        is_active:
          type: boolean
          example: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Coupon:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: SUMMER20
        type:
          type: string
          enum: [percent, fixed]
          example: percent
        discount_value:
          type: number
          format: float
          example: 20
        price_min_order_value:
          type: number
          format: float
          nullable: true
          example: 500000
        max_usage:
          type: integer
          nullable: true
          example: 100
        used_count:
          type: integer
          example: 0
        is_active:
          type: boolean
          example: true
        expiry_date:
          type: string
          format: date
          nullable: true
          example: "2026-12-31"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Văn A
        last_name:
          type: string
          example: Nguyễn
        email:
          type: string
          format: email
          example: customer@example.com
        phone_number:
          type: string
          example: "0901234567"
        status:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Staff:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Nguyễn Văn Admin
        email:
          type: string
          format: email
          example: admin@ecomfashion.vn
        phone_number:
          type: string
          nullable: true
          example: "0909123456"
        avatar:
          type: string
          format: uri
          nullable: true
          example: http://localhost/storage/images/avatars/uuid.jpg
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Permission:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: products.view
        description:
          type: string
          nullable: true
          example: Xem danh sách sản phẩm

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Admin
        description:
          type: string
          nullable: true
          example: Quản trị viên hệ thống
        status:
          type: boolean
          example: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ──────────────────────────────────────────────────────────
    # SCHEMAS — Request Bodies (từ FormRequest rules)
    # ──────────────────────────────────────────────────────────
    CategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 255
          example: Áo khoác
          description: Tên danh mục. Unique trong bảng categories.
        slug:
          type: string
          maxLength: 255
          example: ao-khoac
          description: Slug URL. Unique trong bảng categories.
        description:
          type: string
          nullable: true
          maxLength: 255
          example: Các loại áo khoác
        parent_id:
          type: integer
          nullable: true
          description: ID danh mục cha (phải tồn tại)
          example: 1

    StoreProductRequest:
      type: object
      required: [category_id, name, slug, variants]
      properties:
        category_id:
          type: integer
          description: ID danh mục (phải tồn tại)
          example: 2
        name:
          type: string
          maxLength: 255
          example: Áo Thun Basic
        slug:
          type: string
          description: Unique trong bảng products
          example: ao-thun-basic
        description:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
          maxLength: 100
          example: Local Brand
        thumbnail:
          type: string
          format: uri
          nullable: true
          description: URL ảnh đại diện sản phẩm
          example: http://localhost/storage/images/products/uuid.jpg
        is_active:
          type: boolean
          example: true
        images:
          type: array
          nullable: true
          items:
            type: object
            properties:
              image_url:
                type: string
                format: uri
                nullable: true
                maxLength: 2048
                description: URL storage sau khi upload thành công
                example: http://localhost/storage/images/products/uuid.jpg
              alt_text:
                type: string
                nullable: true
                maxLength: 100
              display_order:
                type: integer
                nullable: true
                minimum: 1
              is_thumbnail:
                type: boolean
                nullable: true
        variants:
          type: array
          minItems: 1
          description: Bắt buộc có ít nhất 1 biến thể
          items:
            type: object
            required: [sku, price, stock_quantity]
            properties:
              sku:
                type: string
                description: Unique trong bảng product_variants
                example: SKU-AO-TRANG-L
              price:
                type: number
                minimum: 0
                example: 250000
              sale_price:
                type: number
                nullable: true
                minimum: 0
                description: Phải nhỏ hơn hoặc bằng price
                example: 199000
              cost_price:
                type: number
                nullable: true
                minimum: 0
                example: 150000
              stock_quantity:
                type: integer
                minimum: 0
                example: 50
              is_active:
                type: boolean
                example: true
              thumbnail:
                type: string
                format: uri
                nullable: true
                maxLength: 2048
                description: URL ảnh biến thể sau khi upload
                example: http://localhost/storage/images/variants/uuid.jpg
              attribute_values:
                type: array
                nullable: true
                items:
                  type: object
                  required: [attribute_id, value]
                  properties:
                    attribute_id:
                      type: integer
                      description: ID thuộc tính (phải tồn tại)
                      example: 1
                    value:
                      type: string
                      maxLength: 50
                      example: Trắng

    UpdateProductRequest:
      allOf:
        - $ref: '#/components/schemas/StoreProductRequest'
        - type: object
          description: |
            Giống StoreProductRequest nhưng:
            - `slug` bỏ qua unique check cho chính sản phẩm đang update
            - `variants.*.sku` unique check bỏ qua ID biến thể đang update
            - `images.*.id` (nullable|integer|exists:product_images,id) — gửi ID để update ảnh cũ
            - `variants.*.id` (nullable|integer|exists:product_variants,id) — gửi ID để update biến thể cũ
          properties:
            images:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  id:
                    type: integer
                    nullable: true
                    description: ID ảnh đã có trong DB. Null = tạo mới.
                    example: 10
                  image_url:
                    type: string
                    format: uri
                    nullable: true
                    maxLength: 2048
                  alt_text:
                    type: string
                    nullable: true
                    maxLength: 100
                  display_order:
                    type: integer
                    nullable: true
                    minimum: 1
                  is_thumbnail:
                    type: boolean
                    nullable: true
            variants:
              type: array
              minItems: 1
              items:
                type: object
                required: [sku, price, stock_quantity]
                properties:
                  id:
                    type: integer
                    nullable: true
                    description: ID biến thể đã có trong DB. Null = tạo mới.
                    example: 5
                  sku:
                    type: string
                    example: SKU-AO-TRANG-L
                  price:
                    type: number
                    minimum: 0
                    example: 250000
                  sale_price:
                    type: number
                    nullable: true
                    minimum: 0
                    example: 199000
                  cost_price:
                    type: number
                    nullable: true
                    minimum: 0
                  stock_quantity:
                    type: integer
                    minimum: 0
                    example: 50
                  is_active:
                    type: boolean
                    example: true
                  thumbnail:
                    type: string
                    format: uri
                    nullable: true
                    maxLength: 2048
                  attribute_values:
                    type: array
                    nullable: true
                    items:
                      type: object
                      required: [attribute_id, value]
                      properties:
                        id:
                          type: integer
                          nullable: true
                          description: ID attribute_value đã có. Null = tạo mới.
                          example: 3
                        attribute_id:
                          type: integer
                          example: 1
                        value:
                          type: string
                          maxLength: 50
                          example: Trắng

    StoreCouponRequest:
      type: object
      required: [code, type, discount_value, is_active]
      properties:
        code:
          type: string
          maxLength: 255
          description: Mã coupon. Unique trong bảng coupons.
          example: SUMMER20
        type:
          type: string
          enum: [percent, fixed]
          example: percent
        discount_value:
          type: number
          minimum: 0
          example: 20
        price_min_order_value:
          type: number
          nullable: true
          minimum: 0
          description: Giá trị đơn hàng tối thiểu để áp dụng coupon
          example: 500000
        max_usage:
          type: integer
          nullable: true
          minimum: 1
          description: Số lần sử dụng tối đa
          example: 100
        is_active:
          type: boolean
          example: true
        expiry_date:
          type: string
          format: date
          nullable: true
          description: Phải sau ngày hôm nay (khi tạo mới)
          example: "2026-12-31"

    UpdateCouponRequest:
      allOf:
        - $ref: '#/components/schemas/StoreCouponRequest'
        - type: object
          description: |
            Giống StoreCouponRequest nhưng:
            - `code` unique bỏ qua coupon đang update
            - `expiry_date` không cần `after:today`

    CustomerRequest:
      type: object
      required: [first_name, last_name, email, phone_number, status]
      properties:
        first_name:
          type: string
          maxLength: 255
          example: Văn A
        last_name:
          type: string
          maxLength: 255
          example: Nguyễn
        email:
          type: string
          format: email
          description: Unique trong bảng customers
          example: customer@example.com
        phone_number:
          type: string
          maxLength: 255
          example: "0901234567"
        password:
          type: string
          description: Bắt buộc khi tạo mới (POST), nullable khi update (PUT)
          example: secret123
        status:
          type: boolean
          example: true

    UpdateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
        - type: object
          description: |
            Giống CustomerRequest nhưng:
            - `password` là nullable
            - `email` unique bỏ qua customer đang update

    StoreStaffRequest:
      type: object
      required: [full_name, email, password, is_active]
      properties:
        full_name:
          type: string
          maxLength: 255
          example: Nguyễn Văn Admin
        email:
          type: string
          format: email
          description: Unique trong bảng staff
          example: admin@ecomfashion.vn
        phone_number:
          type: string
          nullable: true
          maxLength: 20
          example: "0909123456"
        password:
          type: string
          minLength: 6
          maxLength: 255
          example: secret123
        avatar:
          type: string
          nullable: true
          maxLength: 2048
          description: URL ảnh đại diện nhân viên
          example: http://localhost/storage/images/avatars/uuid.jpg
        is_active:
          type: boolean
          example: true

    UpdateStaffRequest:
      allOf:
        - $ref: '#/components/schemas/StoreStaffRequest'
        - type: object
          description: |
            Giống StoreStaffRequest nhưng:
            - `password` là nullable
            - `email` unique bỏ qua staff đang update

    RoleRequest:
      type: object
      required: [name, permissions, status]
      properties:
        name:
          type: string
          maxLength: 255
          example: Manager
        description:
          type: string
          nullable: true
          maxLength: 255
          example: Quản lý cửa hàng
        permissions:
          type: array
          description: Danh sách ID quyền được gán
          items:
            type: integer
          example: [1, 2, 3]
        status:
          type: boolean
          example: true
