services:
  # ═══════════════════════════════════════════════════════════════════
  # MySQL 8.4
  # ═══════════════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.4
    container_name: ecom-fashion-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecom_fashion
      MYSQL_USER: ecom_user
      MYSQL_PASSWORD: ecom_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecom-network

  # ═══════════════════════════════════════════════════════════════════
  # phpMyAdmin
  # ═══════════════════════════════════════════════════════════════════
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ecom-fashion-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecom-network

  # ═══════════════════════════════════════════════════════════════════
  # Laravel Backend
  # ═══════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecom-fashion-backend:latest
    container_name: ecom-fashion-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
